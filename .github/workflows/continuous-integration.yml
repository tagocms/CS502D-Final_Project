name: Busted (Tests) CI workflow
run-name: ${{ github.actor }} is running ${{ github.workflow }} on ${{ github.ref }}
on:
  pull_request:
    branches:
      - main
jobs:
  Run-Busted-Tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install LÖVE, LuaJIT, LuaRocks and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y love luajit libluajit-5.1-dev luarocks xvfb
      - name: Install Busted (Lua 5.1, same runtime as LÖVE)
        run: luarocks --lua-version 5.1 --local install busted
      - name: Run Busted
        run: xvfb-run -a ./test.sh src/