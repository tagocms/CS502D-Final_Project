name: Busted (Tests) CI workflow
run-name: ${{ github.actor }} is running ${{ github.workflow }} on ${{ github.ref }}
on:
  pull_request:
    branches:
      - main
jobs:
  Run-Busted-Tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install LÖVE, LuaJIT, LuaRocks and Xvfb (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: love luajit libluajit-5.1-dev luarocks xvfb
          version: 1.0
      - name: Cache Busted (LuaRocks tree)
        id: luarocks-cache
        uses: actions/cache@v4
        with:
          path: ~/.luarocks
          key: luarocks-busted-${{ runner.os }}-lua5.1-v1
      - name: Install Busted (Lua 5.1, same runtime as LÖVE)
        if: steps.luarocks-cache.outputs.cache-hit != 'true'
        run: luarocks --lua-version 5.1 --local install busted
      - name: Run Busted
        env:
          SDL_AUDIODRIVER: dummy # runner has no sound card; avoids ALSA errors
        run: xvfb-run -a ./test.sh src/